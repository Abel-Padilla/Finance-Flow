services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: financeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: financeflow
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - financeflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeflow"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  financeflow_data:
